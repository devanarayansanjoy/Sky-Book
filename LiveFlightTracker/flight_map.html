<!DOCTYPE html>
<html>
<head>
<title>Live Flight Map</title>
<meta charset='utf-8' />
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<link rel='stylesheet' href='https://unpkg.com/leaflet/dist/leaflet.css'/>
<script src='https://unpkg.com/leaflet/dist/leaflet.js'></script>
</head>
<body>
<div id='map' style='width: 100%; height: 100vh;'></div>
<script>
var map = L.map('map').setView([10.500000, 76.000000], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
var bounds = [[8.000000, 74.000000], [13.000000, 78.000000]];
L.rectangle(bounds, {color: '#ff7800', weight: 1, fillOpacity: 0.1}).addTo(map);
var planeIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61212.png',
  iconSize: [24, 24]
});
L.marker([11.584000, 75.303400], {icon: planeIcon}).bindPopup("<b>Callsign:</b> AXB412<br><b>Origin:</b> India<br><b>Altitude:</b> 10485.1 m<br><b>Speed:</b> 824.5 km/h").addTo(map);
L.marker([11.317500, 77.329400], {icon: planeIcon}).bindPopup("<b>Callsign:</b> AIC3GV<br><b>Origin:</b> India<br><b>Altitude:</b> 10363.2 m<br><b>Speed:</b> 834.1 km/h").addTo(map);
L.marker([9.233400, 76.569600], {icon: planeIcon}).bindPopup("<b>Callsign:</b> IGO1425<br><b>Origin:</b> India<br><b>Altitude:</b> 5806.4 m<br><b>Speed:</b> 667.2 km/h").addTo(map);
L.marker([8.755200, 76.862500], {icon: planeIcon}).bindPopup("<b>Callsign:</b> JZR411<br><b>Origin:</b> Kuwait<br><b>Altitude:</b> 4488.2 m<br><b>Speed:</b> 533.4 km/h").addTo(map);
L.marker([9.330100, 77.337500], {icon: planeIcon}).bindPopup("<b>Callsign:</b> QTR22X<br><b>Origin:</b> Qatar<br><b>Altitude:</b> 11887.2 m<br><b>Speed:</b> 877.4 km/h").addTo(map);
L.marker([8.353300, 76.897600], {icon: planeIcon}).bindPopup("<b>Callsign:</b> AXB530<br><b>Origin:</b> India<br><b>Altitude:</b> 1851.7 m<br><b>Speed:</b> 382.3 km/h").addTo(map);
</script>
</body>
</html>
